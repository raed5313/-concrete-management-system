
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b46">
<title>صدى الإعمار | إدارة الكونكريت الجاهز</title>
<style>
:root{--navy:#102b46;--blue:#1769aa;--gold:#d5a640;--bg:#f3f6fa;--white:#fff;--text:#1d2939;--muted:#667085;--border:#e3e8ef;--green:#14804a;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.layout{min-height:100vh;display:flex}
.sidebar{width:250px;background:var(--navy);color:#fff;padding:22px 14px;flex-shrink:0}
.brand{padding:8px 10px 22px;border-bottom:1px solid #ffffff25;margin-bottom:18px}
.logo{width:46px;height:46px;background:var(--gold);color:var(--navy);border-radius:12px;display:inline-grid;place-items:center;font-size:22px;font-weight:bold;float:right;margin-left:10px}
.brand h2{font-size:16px;margin:3px 0 7px}
.brand small{color:#d5dfeb;font-size:11px}
.nav-label{font-size:11px;color:#a8bfd3;padding:12px 10px 7px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 11px;border:0;border-radius:9px;background:transparent;color:#dce7f1;text-align:right;margin:3px 0;font-size:13px}
.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}
.nav button.active{border-right:3px solid var(--gold)}
.main{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:17px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar h1{font-size:19px;margin:0 0 5px}
.topbar small{color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.avatar{background:#e7eef7;color:var(--navy);padding:10px;border-radius:50%;font-weight:bold}
.content{padding:24px;max-width:1500px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{font-size:20px;margin:0 0 6px}
.page-head p{font-size:12px;color:var(--muted);margin:0}
.btn{border:0;border-radius:8px;padding:10px 15px;font-size:12px;font-weight:bold}
.primary{background:var(--blue);color:#fff}
.gold{background:var(--gold);color:#152b40}
.secondary{background:#e9eef5;color:var(--navy)}
.danger{background:#ffebe9;color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.stat-icon{background:#eaf2fb;color:var(--blue);padding:10px;border-radius:10px;font-size:18px}
.stat strong{display:block;font-size:27px;margin:15px 0 7px}
.stat small{color:var(--muted);font-size:11px}
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:19px;margin-bottom:18px}
.panel h3{font-size:15px;margin:0 0 16px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button{padding:16px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;text-align:center;color:var(--navy)}
.quick button span{display:block;font-size:22px;margin-bottom:9px}
.quick button:hover{border-color:var(--blue);background:#f7fbff}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
th,td{padding:13px 11px;border-bottom:1px solid var(--border);text-align:right}
th{background:#f7f9fc;color:#596579;font-weight:bold}
.empty{text-align:center;color:var(--muted);padding:30px}
.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#e5f6ed;color:var(--green);font-size:11px}
.status.pending{background:#fff4d8;color:#8a6000}
.status.cancel{background:#ffebe9;color:var(--red)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;color:#475467}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d6dde7;border-radius:8px;background:#fff;min-width:0}
.field input:focus,.field select:focus{outline:2px solid #b9d8f7;border-color:var(--blue)}
.full{grid-column:1/-1}
.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.search{max-width:300px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}
.alert{padding:12px;border-radius:8px;background:#fff4d8;color:#805b00;font-size:12px;line-height:1.8;margin-bottom:15px}
.receipt{display:none}
@media(max-width:950px){.sidebar{width:205px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:16px}}
@media(max-width:620px){
 .layout{display:block}.sidebar{width:100%;padding:12px}.brand{padding:5px 8px 13px;margin-bottom:8px}.brand h2{font-size:14px}
 .nav{display:flex;overflow-x:auto;gap:5px}.nav-label{display:none}.nav button{white-space:nowrap;width:auto;flex-shrink:0;padding:10px;font-size:11px}
 .topbar{padding:13px 15px}.topbar h1{font-size:15px}.topbar small{font-size:10px}.content{padding:12px}
 .stat{padding:12px}.stat strong{font-size:22px}.stat-icon{padding:7px}
 .form-grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:13px}
 .search{max-width:100%}.page-head h2{font-size:17px}
}
@media print{
 body{background:#fff}.sidebar,.topbar,.content,.footer{display:none!important}
 body.printing .receipt{display:block!important}
 @page{size:A5 portrait;margin:9mm}
 .receipt{font-family:Tahoma,Arial,sans-serif;color:#111}
 .receipt-head{text-align:center;border-bottom:2px solid #222;padding-bottom:10px}
 .receipt-head h2{margin:5px 0;font-size:19px}
 .receipt-head p{margin:5px;font-size:11px}
 .receipt-title{text-align:center;font-size:17px;margin:15px 0;font-weight:bold}
 .receipt table{white-space:normal;font-size:12px}
 .receipt td{border:1px solid #555;padding:9px}
 .signatures{display:flex;justify-content:space-between;margin-top:40px;font-size:12px}
 .receipt-foot{text-align:center;border-top:1px solid #555;padding-top:8px;margin-top:24px;font-size:10px}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand">
    <div class="logo">ص</div>
    <h2>صدى الإعمار</h2>
    <small>SADA AL-EMAR CONCRETE</small>
    <div style="clear:both"></div>
  </div>
  <div class="nav-label">القائمة الرئيسية</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard">⌂ الرئيسية</button>
    <button data-page="orders">▤ أوامر التجهيز</button>
    <button data-page="loads">▦ الحمولات</button>
    <button data-page="customers">♙ العملاء</button>
    <button data-page="drivers">♟ السائقون</button>
    <button data-page="vehicles">▰ الآليات والخلاطات</button>
    <button data-page="inventory">▥ المخزون</button>
    <button data-page="finance">د.ع الحسابات</button>
    <button data-page="reports">▧ التقارير</button>
    <button data-page="settings">⚙ الإعدادات</button>
  </nav>
</aside>

<main class="main">
<header class="topbar">
  <div>
    <h1 id="top-title">لوحة التحكم</h1>
    <small id="today"></small>
  </div>
  <div class="top-actions">
    <button class="btn secondary" onclick="exportData()">تصدير البيانات</button>
    <div class="avatar">ص</div>
  </div>
</header>
<div class="content" id="content"></div>
<div class="footer">شركة صدى الإعمار للكونكريت الجاهز © <span id="year"></span></div>
</main>
</div>

<div class="receipt" id="receipt"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const storageKey = "sadaAlEmarDemoV1";
const initial = {
  orders: [], loads: [], customers: [], drivers: [], vehicles: [],
  inventory: [
    {id:1,name:"السمنت",qty:0,unit:"طن"},
    {id:2,name:"الرمل",qty:0,unit:"م³"},
    {id:3,name:"الحصى",qty:0,unit:"م³"},
    {id:4,name:"الإضافات",qty:0,unit:"لتر"}
  ],
  transactions: []
};

function loadState(){
  try{
    const saved=localStorage.getItem(storageKey);
    if(!saved) return structuredClone(initial);
    return {...structuredClone(initial),...JSON.parse(saved)};
  }catch(e){return structuredClone(initial)}
}
let db=loadState();
let currentPage="dashboard";
let searchTerm="";

function save(){
  try{
    localStorage.setItem(storageKey,JSON.stringify(db));
    return true;
  }catch(e){
    alert("تعذر حفظ البيانات في المتصفح. تحقق من مساحة التخزين.");
    return false;
  }
}
function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function money(n){return Number(n||0).toLocaleString("en-US")+" د.ع"}
function dateNow(){return new Date().toLocaleString("ar-IQ")}
function nextId(list){return list.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}
function pageTitle(p){
  return {
    dashboard:"لوحة التحكم",orders:"أوامر التجهيز",loads:"إدارة الحمولات",
    customers:"العملاء",drivers:"السائقون",vehicles:"الآليات والخلاطات",
    inventory:"المخزون",finance:"الحسابات",reports:"التقارير",settings:"الإعدادات"
  }[p]||"لوحة التحكم";
}
$("today").textContent=dateNow();
$("year").textContent=new Date().getFullYear();

$("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-page]");
  if(b) showPage(b.dataset.page);
});

function showPage(page){
  currentPage=page; searchTerm="";
  $("top-title").textContent=pageTitle(page);
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  render();
}
function heading(title,subtitle,button=""){
  return `<div class="page-head"><div><h2>${title}</h2><p>${subtitle}</p></div>${button}</div>`;
}
function stat(title,value,icon,foot){
  return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${foot}</small></div>`;
}
function render(){
  const root=$("content");
  if(currentPage==="dashboard"){
    const total=db.orders.reduce((s,o)=>s+Number(o.qty||0),0);
    const delivered=db.loads.reduce((s,l)=>s+Number(l.qty||0),0);
    const revenue=db.transactions.filter(t=>t.type==="قبض").reduce((s,t)=>s+Number(t.amount||0),0);
    root.innerHTML=`
      ${heading("مرحباً بك في نظام صدى الإعمار","ملخص العمل وإدارة تجهيز الخرسانة")}
      <div class="alert">نسخة تجريبية: البيانات محفوظة في هذا المتصفح فقط. لا تستخدمها بعدُ كسجل مالي رسمي أو كقاعدة بيانات مشتركة.</div>
      <div class="cards">
        ${stat("أوامر التجهيز",db.orders.length,"▤","إجمالي الأوامر المسجلة")}
        ${stat("الكمية المطلوبة",total.toLocaleString("en-US")+" م³","▦","مجموع كميات الأوامر")}
        ${stat("الكمية المجهزة",delivered.toLocaleString("en-US")+" م³","🚚","مجموع الحمولات المسجلة")}
        ${stat("إجمالي المقبوضات",money(revenue),"د.ع","القيود المسجلة كقبض")}
      </div>
      <section class="panel"><h3>الوصول السريع</h3>
        <div class="quick">
          <button onclick="openForm('order')"><span>＋</span>أمر تجهيز جديد</button>
          <button onclick="openForm('load')"><span>🚚</span>تسجيل حمولة</button>
          <button onclick="openForm('customer')"><span>♙</span>إضافة عميل</button>
          <button onclick="showPage('reports')"><span>▧</span>عرض التقارير</button>
        </div>
      </section>
      <section class="panel"><h3>أحدث أوامر التجهيز</h3>${ordersTable(db.orders.slice(-5).reverse())}</section>`;
  }else if(currentPage==="orders"){
    root.innerHTML=heading("أوامر التجهيز","إنشاء ومتابعة طلبات تجهيز الخرسانة",`<button class="btn primary" onclick="openForm('order')">＋ أمر جديد</button>`)+
      tableToolbar()+ordersTable(filtered(db.orders));
  }else if(currentPage==="loads"){
    root.innerHTML=heading("إدارة الحمولات","تسجيل الكميات المسلّمة وربطها بأمر تجهيز",`<button class="btn primary" onclick="openForm('load')">＋ إضافة حمولة</button>`)+
      tableToolbar()+loadsTable(filtered(db.loads));
  }else if(currentPage==="customers"){
    root.innerHTML=heading("العملاء","سجل الزبائن ومعلومات الاتصال",`<button class="btn primary" onclick="openForm('customer')">＋ عميل جديد</button>`)+
      tableToolbar()+simpleTable(filtered(db.customers),"customer");
  }else if(currentPage==="drivers"){
    root.innerHTML=heading("السائقون","إدارة بيانات السائقين",`<button class="btn primary" onclick="openForm('driver')">＋ سائق جديد</button>`)+
      tableToolbar()+simpleTable(filtered(db.drivers),"driver");
  }else if(currentPage==="vehicles"){
    root.innerHTML=heading("الآليات والخلاطات","سجل الخلاطات والمضخات والمركبات",`<button class="btn primary" onclick="openForm('vehicle')">＋ آلية جديدة</button>`)+
      tableToolbar()+simpleTable(filtered(db.vehicles),"vehicle");
  }else if(currentPage==="inventory"){
    root.innerHTML=heading("المخزون","متابعة كميات المواد المتاحة",`<button class="btn primary" onclick="openForm('stock')">＋ تحديث المخزون</button>`)+
      `<section class="panel"><div class="table-wrap"><table><thead><tr><th>المادة</th><th>الكمية المتاحة</th><th>الوحدة</th><th>إجراء</th></tr></thead><tbody>`+
      db.inventory.map(x=>`<tr><td>${esc(x.name)}</td><td>${Number(x.qty).toLocaleString("en-US")}</td><td>${esc(x.unit)}</td><td><button class="btn secondary" onclick="editStock(${x.id})">تحديث</button></td></tr>`).join("")+
      `</tbody></table></div></section>`;
  }else if(currentPage==="finance"){
    root.innerHTML=heading("الحسابات","تسجيل المقبوضات والمصروفات",`<button class="btn primary" onclick="openForm('transaction')">＋ قيد جديد</button>`)+financeView();
  }else if(currentPage==="reports"){
    root.innerHTML=heading("التقارير","ملخص الأوامر والحمولات والحسابات")+
      `<div class="cards">
      ${stat("عدد العملاء",db.customers.length,"♙","عميل مسجل")}
      ${stat("عدد السائقين",db.drivers.length,"♟","سائق مسجل")}
      ${stat("عدد الخلاطات",db.vehicles.length,"▰","آلية مسجلة")}
      ${stat("عدد الحمولات",db.loads.length,"🚚","حمولة مسجلة")}</div>
      <section class="panel"><h3>ملخص التجهيز</h3>${ordersTable(db.orders)}</section>
      <section class="panel"><h3>ملخص المقبوضات والمصروفات</h3>${financeView()}</section>
      <button class="btn primary" onclick="exportData()">تصدير البيانات بصيغة JSON</button>
      <button class="btn secondary" onclick="exportCSV()">تصدير الأوامر CSV</button>`;
  }else if(currentPage==="settings"){
    root.innerHTML=heading("الإعدادات","معلومات الشركة وأدوات النسخ الاحتياطي")+
      `<section class="panel"><h3>بيانات الشركة</h3><div class="form-grid">
      <div class="field"><label>اسم الشركة</label><input id="companyName" value="${esc(localStorage.getItem("sadaCompanyName")||"شركة صدى الإعمار للكونكريت الجاهز")}"></div>
      <div class="field"><label>الاسم بالإنجليزية</label><input id="companyEn" value="${esc(localStorage.getItem("sadaCompanyEn")||"SADA AL-EMAR CONCRETE")}"></div>
      <div class="field"><label>رقم الهاتف</label><input id="companyPhone" value="${esc(localStorage.getItem("sadaCompanyPhone")||"")}"></div>
      <div class="field"><label>العنوان</label><input id="companyAddress" value="${esc(localStorage.getItem("sadaCompanyAddress")||"")}"></div>
      </div><div class="form-actions"><button class="btn primary" onclick="saveSettings()">حفظ الإعدادات</button><button class="btn secondary" onclick="exportData()">تنزيل نسخة احتياطية</button><button class="btn danger" onclick="resetDemo()">مسح بيانات هذا المتصفح</button></div></section>
      <div class="alert">لا تضع كلمات مرور حقيقية أو بيانات سرية في هذه النسخة. لا يوجد حالياً تسجيل دخول آمن أو نظام صلاحيات متعدد المستخدمين.</div>`;
  }
}
function tableToolbar(){
  return `<div style="margin:0 0 13px"><input class="search" placeholder="بحث في السجلات..." oninput="searchTerm=this.value;refreshTable()"></div>`;
}
function refreshTable(){
  const el=document.querySelector("#content .table-wrap");
  if(!el)return;
  const t=currentPage==="orders"?ordersTable(filtered(db.orders)):currentPage==="loads"?loadsTable(filtered(db.loads)):simpleTable(filtered(db[currentPage]),currentPage.slice(0,-1));
  el.outerHTML=`<div class="table-wrap">${t}</div>`;
}
function filtered(arr){
  if(!searchTerm)return arr;
  const q=searchTerm.toLowerCase();
  return arr.filter(x=>Object.values(x).some(v=>String(v??"").toLowerCase().includes(q)));
}
function ordersTable(list){
  if(!list.length)return `<div class="empty">لا توجد أوامر تجهيز مسجلة بعد.</div>`;
  return `<div class="table-wrap"><table><thead><tr><th>رقم الأمر</th><th>التاريخ</th><th>العميل</th><th>موقع الصب</th><th>المواصفة</th><th>الكمية م³</th><th>السعر</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>`+
  list.map(o=>`<tr><td>${esc(o.number)}</td><td>${esc(o.date)}</td><td>${esc(o.customer)}</td><td>${esc(o.site)}</td><td>${esc(o.spec)}</td><td>${Number(o.qty||0)}</td><td>${money(o.price)}</td><td><span class="status ${o.status==="ملغي"?"cancel":o.status==="قيد التجهيز"?"pending":""}">${esc(o.status||"جديد")}</span></td><td><button class="btn secondary" onclick="printOrder(${o.id})">طباعة</button> <button class="btn danger" onclick="removeRecord('orders',${o.id})">حذف</button></td></tr>`).join("")+
  `</tbody></table></div>`;
}
function loadsTable(list){
  if(!list.length)return `<div class="empty">لا توجد حمولات مسجلة بعد.</div>`;
  return `<div class="table-wrap"><table><thead><tr><th>رقم الوصل</th><th>التاريخ</th><th>رقم الأمر</th><th>العميل</th><th>السائق</th><th>الخلاطة</th><th>الحمولة</th><th>الكمية م³</th><th>إجراء</th></tr></thead><tbody>`+
  list.map(l=>`<tr><td>${esc(l.receipt)}</td><td>${esc(l.date)}</td><td>${esc(l.orderNumber)}</td><td>${esc(l.customer)}</td><td>${esc(l.driver)}</td><td>${esc(l.vehicle)}</td><td>${esc(l.loadNo)}</td><td>${Number(l.qty||0)}</td><td><button class="btn secondary" onclick="printLoad(${l.id})">طباعة وصل A5</button> <button class="btn danger" onclick="removeRecord('loads',${l.id})">حذف</button></td></tr>`).join("")+
  `</tbody></table></div>`;
}
function simpleTable(list,type){
  const configs={
    customer:{title:["اسم العميل","الهاتف","العنوان"],keys:["name","phone","address"],arr:"customers"},
    driver:{title:["اسم السائق","الهاتف","رقم الإجازة"],keys:["name","phone","license"],arr:"drivers"},
    vehicle:{title:["نوع الآلية","رقم المركبة","ملاحظات"],keys:["kind","plate","notes"],arr:"vehicles"}
  };
  const c=configs[type];
  if(!c)return `<div class="empty">لا توجد سجلات.</div>`;
  if(!list.length)return `<div class="empty">لا توجد بيانات مسجلة بعد.</div>`;
  return `<div class="table-wrap"><table><thead><tr>${c.title.map(x=>`<th>${x}</th>`).join("")}<th>إجراء</th></tr></thead><tbody>`+
  list.map(x=>`<tr>${c.keys.map(k=>`<td>${esc(x[k])}</td>`).join("")}<td><button class="btn danger" onclick="removeRecord('${c.arr}',${x.id})">حذف</button></td></tr>`).join("")+
  `</tbody></table></div>`;
}
function financeView(){
  const received=db.transactions.filter(t=>t.type==="قبض").reduce((s,t)=>s+Number(t.amount||0),0);
  const expenses=db.transactions.filter(t=>t.type==="مصروف").reduce((s,t)=>s+Number(t.amount||0),0);
  return `<div class="cards">${stat("المقبوضات",money(received),"＋","مجموع قيود القبض")}${stat("المصروفات",money(expenses),"−","مجموع قيود الصرف")}${stat("الصافي",money(received-expenses),"د.ع","المقبوضات ناقص المصروفات")}</div>
  <div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th><th>إجراء</th></tr></thead><tbody>`+
  (db.transactions.length?db.transactions.slice().reverse().map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.type)}</td><td>${esc(t.note)}</td><td>${money(t.amount)}</td><td><button class="btn danger" onclick="removeRecord('transactions',${t.id})">حذف</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">لا توجد قيود مالية</td></tr>`)+
  `</tbody></table></div>`;
}

function openForm(type){
  const forms={
    order:{title:"إنشاء أمر تجهيز",fields:[
      ["number","رقم الأمر","text",`SE-${String(nextId(db.orders)).padStart(5,"0")}`],
      ["date","التاريخ والوقت","text",dateNow()],
      ["customer","اسم العميل","select",db.customers.map(c=>c.name)],
      ["phone","رقم هاتف العميل","tel",""],
      ["site","العنوان / موقع الصب","text",""],
      ["pour","نوع الصب","text",""],
      ["spec","المقاومة / المواصفة","text","C30"],
      ["qty","الكمية المطلوبة م³","number",""],
      ["price","السعر الإجمالي بالدينار","number",""],
      ["notes","ملاحظات","text",""]
    ]},
    load:{title:"تسجيل حمولة جديدة",fields:[
      ["receipt","رقم وصل التجهيز","text",`REC-${String(nextId(db.loads)).padStart(6,"0")}`],
      ["date","التاريخ والوقت","text",dateNow()],
      ["orderId","أمر التجهيز","select",db.orders.map(o=>({value:o.id,label:o.number+" - "+o.customer}))],
      ["driver","اسم السائق","select",db.drivers.map(d=>d.name)],
      ["vehicle","رقم الخلاطة","select",db.vehicles.map(v=>v.plate)],
      ["pump","رقم المضخة (إن وجدت)","text",""],
      ["qty","الكمية المسلّمة م³","number",""],
      ["notes","ملاحظات","text",""]
    ]},
    customer:{title:"إضافة عميل",fields:[["name","اسم العميل","text",""],["phone","رقم الهاتف","tel",""],["address","العنوان","text",""],["notes","ملاحظات","text",""]]},
    driver:{title:"إضافة سائق",fields:[["name","اسم السائق","text",""],["phone","رقم الهاتف","tel",""],["license","رقم الإجازة","text",""]]},
    vehicle:{title:"إضافة آلية أو خلاطة",fields:[["kind","نوع الآلية","select",["خلاطة","مضخة","شاحنة","أخرى"]],["plate","رقم المركبة","text",""],["notes","ملاحظات","text",""]]},
    transaction:{title:"تسجيل قيد مالي",fields:[["type","نوع القيد","select",["قبض","مصروف"]],["date","التاريخ","text",dateNow()],["note","البيان","text",""],["amount","المبلغ بالدينار","number",""]]},
    stock:{title:"تحديث المخزون",fields:[["item","المادة","select",db.inventory.map(x=>({value:x.id,label:x.name}))],["qty","الكمية الجديدة","number",""]]}
  };
  const f=forms[type];
  if(!f){alert("النموذج غير متاح");return}
  const fields=f.fields.map(([id,label,kind,opts])=>{
    let control="";
    if(kind==="select"){
      const options=opts.map(o=>typeof o==="object"?`<option value="${esc(o.value)}">${esc(o.label)}</option>`:`<option value="${esc(o)}">${esc(o)}</option>`).join("");
      control=`<select id="f-${id}" ${opts.length?"":"disabled"}><option value="">اختر...</option>${options}</select>`;
    }else{
      control=`<input id="f-${id}" type="${kind}" value="${esc(opts)}" ${kind==="number"?'min="0" step="any"':''} ${["number"].includes(kind)?"required":""}>`;
    }
    return `<div class="field ${id==="notes"||id==="site"?"full":""}"><label for="f-${id}">${label}</label>${control}</div>`;
  }).join("");
  $("content").innerHTML=heading(f.title,"أدخل البيانات ثم اضغط حفظ")+
    `<section class="panel"><form id="entryForm"><div class="form-grid">${fields}</div><div class="form-actions"><button class="btn primary" type="submit">حفظ البيانات</button><button class="btn secondary" type="button" onclick="showPage('${currentPage}')">إلغاء</button></div></form></section>`;
  $("entryForm").addEventListener("submit",e=>{
    e.preventDefault();
    const data={};
    f.fields.forEach(([id])=>{const el=$("f-"+id);data[id]=el?el.value.trim():""});
    if(type==="order"){
      if(!data.customer){alert("أضف عميلاً أولاً ثم اختره");return}
      if(!(Number(data.qty)>0)){alert("أدخل كمية صحيحة");return}
      db.orders.push({...data,id:nextId(db.orders),qty:Number(data.qty),price:Number(data.price||0),status:"جديد"});
    }else if(type==="load"){
      if(!data.orderId){alert("أضف أمر تجهيز أولاً");return}
      if(!(Number(data.qty)>0)){alert("أدخل كمية صحيحة");return}
      const order=db.orders.find(o=>o.id===Number(data.orderId));
      if(!order){alert("الأمر المحدد غير موجود");return}
      const previous=db.loads.filter(l=>l.orderId===order.id).reduce((s,l)=>s+Number(l.qty),0);
      if(previous+Number(data.qty)>Number(order.qty)){
        if(!confirm("الكمية المسلّمة ستتجاوز الكمية المطلوبة. هل تريد المتابعة؟"))return;
      }
      db.loads.push({...data,id:nextId(db.loads),orderId:order.id,orderNumber:order.number,customer:order.customer,qty:Number(data.qty),loadNo:db.loads.filter(l=>l.orderId===order.id).length+1});
      if(previous+Number(data.qty)>=Number(order.qty))order.status="مكتمل";else order.status="قيد التجهيز";
    }else if(type==="customer"){
      if(!data.name){alert("أدخل اسم العميل");return}
      db.customers.push({...data,id:nextId(db.customers)});
    }else if(type==="driver"){
      if(!data.name){alert("أدخل اسم السائق");return}
      db.drivers.push({...data,id:nextId(db.drivers)});
    }else if(type==="vehicle"){
      if(!data.plate){alert("أدخل رقم المركبة");return}
      db.vehicles.push({...data,id:nextId(db.vehicles)});
    }else if(type==="transaction"){
      if(!(Number(data.amount)>0)){alert("أدخل مبلغاً صحيحاً");return}
      db.transactions.push({...data,id:nextId(db.transactions),amount:Number(data.amount)});
    }else if(type==="stock"){
      const item=db.inventory.find(x=>x.id===Number(data.item));
      if(!item){alert("اختر مادة");return}
      item.qty=Number(data.qty||0);
    }
    if(save()){showPage(type==="stock"?"inventory":type==="transaction"?"finance":type==="order"?"orders":type==="load"?"loads":type==="customer"?"customers":type==="driver"?"drivers":"vehicles");}
  });
}
function removeRecord(key,id){
  if(!confirm("هل تريد حذف هذا السجل؟"))return;
  db[key]=db[key].filter(x=>x.id!==id);
  save();render();
}
function editStock(id){
  const item=db.inventory.find(x=>x.id===id);
  if(!item)return;
  const value=prompt("أدخل الكمية الجديدة للمادة: "+item.name,item.qty);
  if(value===null)return;
  if(value.trim()===""||!Number.isFinite(Number(value))||Number(value)<0){alert("أدخل كمية صحيحة");return}
  item.qty=Number(value);save();render();
}
function saveSettings(){
  localStorage.setItem("sadaCompanyName",$("companyName").value);
  localStorage.setItem("sadaCompanyEn",$("companyEn").value);
  localStorage.setItem("sadaCompanyPhone",$("companyPhone").value);
  localStorage.setItem("sadaCompanyAddress",$("companyAddress").value);
  alert("تم حفظ الإعدادات على هذا المتصفح.");
}
function resetDemo(){
  if(!confirm("سيتم حذف بيانات النظام التجريبي من هذا المتصفح. هل أنت متأكد؟"))return;
  db=structuredClone(initial);save();render();
}
function exportData(){
  download("sada-al-emar-backup.json",JSON.stringify({company:localStorage.getItem("sadaCompanyName")||"شركة صدى الإعمار",data:db},null,2),"application/json;charset=utf-8");
}
function exportCSV(){
  const rows=[["رقم الأمر","التاريخ","العميل","موقع الصب","المواصفة","الكمية","السعر","الحالة"],
    ...db.orders.map(o=>[o.number,o.date,o.customer,o.site,o.spec,o.qty,o.price,o.status])];
  const csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  download("sada-orders.csv",csv,"text/csv;charset=utf-8");
}
function download(name,data,type){
  const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}
function companyName(){return localStorage.getItem("sadaCompanyName")||"شركة صدى الإعمار للكونكريت الجاهز"}

  <div class="receipt-title">وصل تجهيز خرسانة</div>
  <table><tbody>
  <tr><td>رقم الوصل</td><td>${esc(l.receipt)}</td></tr>
  <tr><td>التاريخ والوقت</td><td>${esc(l.date)}</td></tr>
  <tr><td>رقم أمر التجهيز</td><td>${esc(l.orderNumber)}</td></tr>
  <tr><td>اسم العميل</td><td>${esc(l.customer)}</td></tr>
  <tr><td>موقع الصب</td><td>${esc(o.site||"")}</td></tr>
  <tr><td>نوع الصب</td><td>${esc(o.pour||"")}</td></tr>

  <tr><td>رقم المضخة</td><td>${esc(l.pump||"—")}</td></tr>
  <tr><td>اسم السائق</td><td>${esc(l.driver||"")}</td></tr>
  <tr><td>رقم الحمولة</td><td>${esc(l.loadNo)}</td></tr>
  <tr><td><b>الكمية المسلّمة م³</b></td><td><b style="font-size:20px">${esc(l.qty)}</b></td></tr>
  </tbody></table>
  <div class="signatures"><div>توقيع المختبر: ................</div><div>توقيع العميل: ................</div></div>
  <div class="receipt-foot">نشكركم على ثقتكم بشركة صدى الإعمار</div>`;
}
function printLoad(id){
  const l=db.loads.find(x=>x.id===id);if(!l)return;
  $("receipt").innerHTML=receiptHTML(l);
  document.body.classList.add("printing");
  window.print();
  setTimeout(()=>document.body.classList.remove("printing"),800);
}
function printOrder(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  $("receipt").innerHTML=`<div class="receipt-head"><h2>${esc(companyName())}</h2><p>SADA AL-EMAR CONCRETE</p></div><div class="receipt-title">أمر تجهيز خرسانة</div>
  <table><tbody>
  <tr><td>رقم الأمر</td><td>${esc(o.number)}</td></tr><tr><td>التاريخ</td><td>${esc(o.date)}</td></tr>
  <tr><td>العميل</td><td>${esc(o.customer)}</td></tr><tr><td>الهاتف</td><td>${esc(o.phone)}</td></tr>
  <tr><td>موقع الصب</td><td>${esc(o.site)}</td></tr><tr><td>نوع الصب</td><td>${esc(o.pour)}</td></tr>
  <tr><td>المواصفة</td><td>${esc(o.spec)}</td></tr><tr><td>الكمية المطلوبة</td><td>${esc(o.qty)} م³</td></tr>
  <tr><td>السعر الإجمالي</td><td>${money(o.price)}</td></tr><tr><td>ملاحظات</td><td>${esc(o.notes)}</td></tr>
  </tbody></table><div class="signatures"><div>مسؤول التجهيز: ................</div><div>توقيع العميل: ................</div></div>`;
  document.body.classList.add("printing");window.print();
  setTimeout(()=>document.body.classList.remove("printing"),800);

window.addEventListener("afterprint",()=>document.body.classList.remove("printing"));
render();
</script>
